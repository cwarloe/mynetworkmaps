[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netdiag"
version = "0.1.0"
description = "Turn a simple device CSV into an accurate, clean, editable network diagram"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netdiag = "netdiag.cli:main"

[tool.setuptools]
packages = ["netdiag"]

[tool.setuptools.package-data]
netdiag = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
